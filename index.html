    th { font-size: 11px; font-weight: 600; color: #6e7681;

<script>
const cfg = {"datasets": [{"label": "iPhone 17 256G 綠/紫/白", "data": [{"x": "2026-05-23", "y": 25800}], "borderColor": "#f87171", "backgroundColor": "#f8717122", "tension": 0.35, "fill": false, "pointRadius": 5, "pointHoverRadius": 8}, {"label": "iPhone 17 256G 黑/藍", "data": [{"x": "2026-05-23", "y": 25800}], "borderColor": "#60a5fa", "backgroundColor": "#60a5fa22", "tension": 0.35, "fill": false, "pointRadius": 5, "pointHoverRadius": 8}, {"label": "iPhone 17 Pro 256G 銀/藍/橘", "data": [{"x": "2026-05-23", "y": 37300}], "borderColor": "#fbbf24", "backgroundColor": "#fbbf2422", "tension": 0.35, "fill": false, "pointRadius": 5, "pointHoverRadius": 8}, {"label": "iPhone 17 Pro Max 256G 銀", "data": [{"x": "2026-05-23", "y": 42300}], "borderColor": "#34d399", "backgroundColor": "#34d39922", "tension": 0.35, "fill": false, "pointRadius": 5, "pointHoverRadius": 8}, {"label": "iPhone 17 Pro Max 256G 橘/藍", "data": [{"x": "2026-05-23", "y": 42200}], "borderColor": "#a78bfa", "backgroundColor": "#a78bfa22", "tension": 0.35, "fill": false, "pointRadius": 5, "pointHoverRadius": 8}]};
